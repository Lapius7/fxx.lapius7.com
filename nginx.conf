# /etc/nginx/sites-enabled/fxx.lapius7.com の元ファイル(このリポジトリで管理し、変更したらコピーして nginx -t && reload)
server {
    listen 80;
    listen [::]:80;
    server_name fxx.lapius7.com x.lapius7.com;
    return 301 https://fxx.lapius7.com$request_uri;
}

# 旧ドメイン x.lapius7.com は新ドメインへ転送する
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name x.lapius7.com;

    ssl_certificate /etc/letsencrypt/live/x.lapius7.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x.lapius7.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://fxx.lapius7.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fxx.lapius7.com;

    # *.lapius7.com のCloudflareオリジン証明書(fxgh.lapius7.com等と共通)
    ssl_certificate /etc/nginx/ssl/lapius7.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lapius7.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
